name: Fork Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, for example v0.7.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'dcdude71/AntennaPod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z.-]+$ ]]; then
            echo "Not a release tag: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed free release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain :app:assembleFreeRelease \
            -PforkVersionName="${RELEASE_TAG#v}" \
            -PreleaseStoreFile="$RUNNER_TEMP/release.keystore" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"
      - name: Rename APK
        run: cp app/build/outputs/apk/free/release/app-free-release.apk "AntennaPod-Mix-${RELEASE_TAG}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          EXTRA_ARGS=()
          if [ -n "$PREVIOUS_TAG" ]; then
            EXTRA_ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "AntennaPod-Mix-${RELEASE_TAG}.apk" --title "$RELEASE_TAG" \
            --generate-notes --verify-tag "${EXTRA_ARGS[@]}"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
