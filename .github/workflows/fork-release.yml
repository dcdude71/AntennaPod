name: Fork Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'stephanemoulec/AntennaPod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed free release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain :app:assembleFreeRelease \
            -PforkVersionName="${GITHUB_REF_NAME#v}" \
            -PreleaseStoreFile="$RUNNER_TEMP/release.keystore" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"
      - name: Rename APK
        run: cp app/build/outputs/apk/free/release/app-free-release.apk "AntennaPod-Mix-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            gh release create "$GITHUB_REF_NAME" "AntennaPod-Mix-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" \
              --generate-notes --notes-start-tag "$PREVIOUS_TAG"
          else
            gh release create "$GITHUB_REF_NAME" "AntennaPod-Mix-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
